<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>增肌飲食追蹤器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F1E8;
    --panel: #FFFFFF;
    --ink: #232019;
    --ink-soft: #6B6355;
    --line: #E3DACB;
    --protein: #2B6E63;
    --protein-soft: #E4EFEC;
    --kcal: #C0672E;
    --kcal-soft: #F7E8DC;
    --fat: #8A5A9E;
    --fat-soft: #EFE6F2;
    --water: #2E76B6;
    --train: #2B6E63;
    --rest: #8A7F6A;
    --done-bg: #F0EDE3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    padding:24px 16px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  header{margin-bottom:20px;position:relative;}
  .eyebrow{
    font-family:'Space Grotesk',sans-serif;
    font-size:12px;
    letter-spacing:0.14em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin:0 0 6px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .gear-btn{
    background:none;border:1px solid var(--line);border-radius:8px;
    width:30px;height:30px;cursor:pointer;font-size:15px;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);
  }
  .gear-btn:hover{background:var(--done-bg);}
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:26px;
    font-weight:700;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .sub{color:var(--ink-soft);font-size:14px;margin:0;}

  /* auth bar */
  .authbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 12px;
    margin-top:14px;
    font-size:13px;
  }
  .authbar .msg{color:var(--ink-soft);}
  .google-btn{
    display:flex;align-items:center;gap:8px;
    background:var(--ink);color:var(--bg);
    border:none;border-radius:8px;padding:8px 14px;
    font-size:13px;font-family:'Noto Sans TC',sans-serif;cursor:pointer;
  }
  .google-btn svg{width:16px;height:16px;flex-shrink:0;}
  .user-chip{display:flex;align-items:center;gap:8px;}
  .user-chip img{width:26px;height:26px;border-radius:50%;}
  .user-chip .uname{font-weight:600;font-size:13px;}
  .signout-btn{
    font-size:12px;color:var(--ink-soft);background:none;
    border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;
  }
  .signout-btn:hover{background:var(--done-bg);}
  .sync-note{font-size:11px;color:var(--ink-soft);}
  .sync-note.err{color:var(--kcal);}

  /* settings panel */
  .settings-panel{
    display:none;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    margin-top:10px;
  }
  .settings-panel.open{display:block;}
  .settings-panel h3{margin:0 0 10px;font-size:14px;}
  .settings-grid{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;
  }
  .settings-grid label{font-size:11px;color:var(--ink-soft);display:block;margin-bottom:3px;}
  .settings-grid input{
    width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px;
  }
  .settings-group-label{font-size:12px;font-weight:600;margin:8px 0 6px;}
  .save-settings-btn{
    background:var(--ink);color:var(--bg);border:none;border-radius:8px;
    padding:8px 14px;font-size:13px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;
  }

  /* week nav + day tabs */
  .weeknav{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:20px;font-size:12px;color:var(--ink-soft);
  }
  .weeknav button{
    background:none;border:1px solid var(--line);border-radius:8px;
    padding:5px 10px;cursor:pointer;font-size:12px;color:var(--ink);
  }
  .weeknav button:hover{background:var(--done-bg);}
  .tabs{
    display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0 18px;
  }
  .tab{
    border:1px solid var(--line);background:var(--panel);border-radius:10px;
    padding:8px 2px 7px;text-align:center;cursor:pointer;transition:all .15s ease;
    position:relative;
  }
  .tab .d{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;}
  .tab .dt{display:block;font-size:9px;color:var(--ink-soft);margin-top:1px;}
  .tab .k{display:block;font-size:9px;margin-top:2px;color:var(--ink-soft);}
  .tab.active{border-color:var(--ink);background:var(--ink);}
  .tab.active .d, .tab.active .k, .tab.active .dt{color:var(--bg);}
  .tab.active.train{background:var(--train);border-color:var(--train);}
  .tab.active.rest{background:var(--rest);border-color:var(--rest);}
  .tab.today::after{
    content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;
    border-radius:50%;background:var(--kcal);
  }

  /* progress panel */
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
  .stat-card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 12px;
  }
  .stat-label{font-size:11px;color:var(--ink-soft);display:flex;justify-content:space-between;margin-bottom:6px;}
  .stat-num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;}
  .bar-track{height:7px;border-radius:5px;background:var(--done-bg);margin-top:8px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:5px;transition:width .3s ease;}
  .protein .bar-fill{background:var(--protein);}
  .kcal .bar-fill{background:var(--kcal);}
  .fat .bar-fill{background:var(--fat);}
  .protein .stat-num{color:var(--protein);}
  .kcal .stat-num{color:var(--kcal);}
  .fat .stat-num{color:var(--fat);}

  /* water tracker */
  .water-card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;
  }
  .water-info{font-size:13px;}
  .water-info b{color:var(--water);font-family:'Space Grotesk',sans-serif;font-size:17px;}
  .water-btns{display:flex;gap:6px;}
  .water-btn{
    background:var(--water);color:#fff;border:none;border-radius:8px;
    padding:7px 12px;font-size:12px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;
  }
  .water-reset{
    background:none;border:1px solid var(--line);border-radius:8px;
    padding:7px 10px;font-size:12px;cursor:pointer;color:var(--ink-soft);
  }

  /* streak + weekly overview */
  .overview-row{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-bottom:14px;}
  .streak-card, .weekly-card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  }
  .streak-card{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
  .streak-num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;color:var(--kcal);}
  .streak-label{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .weekly-card .wk-title{font-size:11px;color:var(--ink-soft);margin-bottom:8px;}
  .wk-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:5px;}
  .wk-row b{font-family:'Space Grotesk',sans-serif;}

  /* meal blocks */
  .meal{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;}
  .meal-head{
    padding:12px 16px 10px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .meal-head .name{font-weight:700;font-size:15px;}
  .meal-head .agg{font-size:12px;color:var(--ink-soft);}
  ul.items{list-style:none;margin:0;padding:6px 8px;}
  li.item{
    display:flex;align-items:center;gap:8px;padding:9px 8px;border-radius:8px;
    cursor:pointer;user-select:none;
  }
  li.item:hover{background:var(--done-bg);}
  li.item.checked .item-name, li.item.checked .item-qty{text-decoration:line-through;color:var(--ink-soft);}
  .check{
    width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;background:var(--panel);
  }
  li.item.checked .check{background:var(--protein);border-color:var(--protein);}
  .check svg{width:12px;height:12px;opacity:0;}
  li.item.checked .check svg{opacity:1;}
  .item-text{flex:1;min-width:0;}
  .item-name{font-size:14px;font-weight:500;}
  .item-qty{font-size:12px;color:var(--ink-soft);}
  .item-macro{font-size:10.5px;color:var(--ink-soft);white-space:nowrap;text-align:right;}
  .swap-btn{
    width:24px;height:24px;flex-shrink:0;border-radius:7px;border:1px solid var(--line);
    background:var(--panel);display:flex;align-items:center;justify-content:center;
    font-size:12px;cursor:pointer;color:var(--ink-soft);
  }
  .swap-btn:hover{background:var(--done-bg);}

  /* weight log */
  .weight-section{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;margin-bottom:14px;
  }
  .weight-section h3{margin:0 0 10px;font-size:14px;}
  .weight-input-row{display:flex;gap:8px;margin-bottom:12px;}
  .weight-input-row input{
    flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;
  }
  .weight-input-row button{
    background:var(--ink);color:var(--bg);border:none;border-radius:8px;
    padding:8px 14px;font-size:13px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;
  }
  .weight-chart{width:100%;height:70px;display:block;}
  .weight-list{font-size:11px;color:var(--ink-soft);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;}

  footer{
    margin-top:22px;padding-top:16px;border-top:1px solid var(--line);
    font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between;align-items:center;
  }
  .reset-btn{
    font-family:'Noto Sans TC',sans-serif;font-size:12px;background:none;
    border:1px solid var(--line);border-radius:8px;padding:7px 12px;color:var(--ink);cursor:pointer;
  }
  .reset-btn:hover{background:var(--done-bg);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow"><span>增肌飲食計畫 · 178cm / 82kg</span><button class="gear-btn" id="gearBtn" title="設定">⚙</button></p>
    <h1>今天吃了嗎?</h1>
    <p class="sub">點項目打勾記錄,自動累計蛋白質、熱量與脂肪進度</p>

    <div class="authbar" id="authbar"><span class="msg">正在連線...</span></div>

    <div class="settings-panel" id="settingsPanel">
      <h3>目標設定</h3>
      <div class="settings-group-label">訓練日目標</div>
      <div class="settings-grid">
        <div><label>蛋白質(g)</label><input type="number" id="set_train_p"></div>
        <div><label>熱量(kcal)</label><input type="number" id="set_train_k"></div>
        <div><label>脂肪(g)</label><input type="number" id="set_train_f"></div>
      </div>
      <div class="settings-group-label">休息日目標</div>
      <div class="settings-grid">
        <div><label>蛋白質(g)</label><input type="number" id="set_rest_p"></div>
        <div><label>熱量(kcal)</label><input type="number" id="set_rest_k"></div>
        <div><label>脂肪(g)</label><input type="number" id="set_rest_f"></div>
      </div>
      <button class="save-settings-btn" id="saveSettingsBtn">儲存設定</button>
    </div>
  </header>

  <div class="weeknav">
    <button id="prevWeekBtn">◀ 上週</button>
    <span id="weekLabel"></span>
    <button id="nextWeekBtn">下週 ▶</button>
  </div>
  <div class="tabs" id="tabs"></div>

  <div class="stats">
    <div class="stat-card protein">
      <div class="stat-label"><span>蛋白質</span><span id="proteinTarget"></span></div>
      <div class="stat-num" id="proteinNum">0g</div>
      <div class="bar-track"><div class="bar-fill" id="proteinBar" style="width:0%"></div></div>
    </div>
    <div class="stat-card kcal">
      <div class="stat-label"><span>熱量</span><span id="kcalTarget"></span></div>
      <div class="stat-num" id="kcalNum">0</div>
      <div class="bar-track"><div class="bar-fill" id="kcalBar" style="width:0%"></div></div>
    </div>
    <div class="stat-card fat">
      <div class="stat-label"><span>脂肪</span><span id="fatTarget"></span></div>
      <div class="stat-num" id="fatNum">0g</div>
      <div class="bar-track"><div class="bar-fill" id="fatBar" style="width:0%"></div></div>
    </div>
  </div>

  <div class="water-card">
    <div class="water-info">💧 今日喝水 <b id="waterNum">0</b> ml <span style="color:var(--ink-soft);">/ 建議 3000ml</span></div>
    <div class="water-btns">
      <button class="water-btn" id="water250">+250ml</button>
      <button class="water-btn" id="water500">+500ml</button>
      <button class="water-reset" id="waterReset">重設</button>
    </div>
  </div>

  <div class="overview-row">
    <div class="streak-card">
      <div class="streak-num" id="streakNum">0</div>
      <div class="streak-label">連續達標天數</div>
    </div>
    <div class="weekly-card">
      <div class="wk-title">近 7 天平均達成率</div>
      <div class="wk-row"><span>蛋白質</span><b id="wkProtein">-</b></div>
      <div class="wk-row"><span>熱量</span><b id="wkKcal">-</b></div>
    </div>
  </div>

  <div id="meals"></div>

  <div class="weight-section">
    <h3>體重紀錄</h3>
    <div class="weight-input-row">
      <input type="number" step="0.1" id="weightInput" placeholder="今天體重 (kg)">
      <button id="weightSaveBtn">記錄</button>
    </div>
    <svg class="weight-chart" id="weightChart" viewBox="0 0 600 70" preserveAspectRatio="none"></svg>
    <div class="weight-list" id="weightList"></div>
  </div>

  <footer>
    <span id="footNote"></span>
    <button class="reset-btn" id="resetBtn">重設這天</button>
  </footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, collection, getDocs, query, orderBy, limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// ⚠️ 這組設定是先前根據亂碼內容猜測還原的。如果登入/同步一直失敗，
// 回 Firebase Console → 專案設定 → 你的網頁應用程式，把完整正確的 firebaseConfig 貼給我。
const firebaseConfig = {

  authDomain: "projerct-d29a6.firebaseapp.com",
  projectId: "projerct-d29a6",
  storageBucket: "projerct-d29a6.firebasestorage.app",
  messagingSenderId: "721257579244",
  appId: "1:721257579244:web:3c8d051d43e49c0b415bc9",
};

const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const auth = getAuth(firebaseApp);
const provider = new GoogleAuthProvider();

let currentUser = null;

// ---------- 食物資料(每項含 variants,第一個是預設，其餘是可切換的替代選項) ----------
function v(name, qty, p, k, f){ return {name, qty, p, k, f}; }

const TRAIN_ITEMS = [

  {meal:"早餐", items:[

    {variants:[v("全麥吐司","1.5片(約60g)",6,150,2)]},

  ]},
  {meal:"下午點心", items:[
    {variants:[v("無糖優格","200g",10,120,4)]},
    {variants:[v("堅果","20g",4,120,10)]},
  ]},
  {meal:"晚餐", items:[
    {variants:[v("糙米飯","150g熟飯",4,195,1)]},
    {variants:[v("鱸魚/鯛魚","180g",40,230,8), v("雞胸肉","180g",50,280,6), v("雞腿肉(去皮)","180g",46,330,16)]},

  ]},

// Sun,Mon,Tue,Wed,Thu,Fri,Sat -> 對應原本 週一rest 週二train 週三train 週四rest 週五train 週六train 週日rest
const WEEKDAY_TYPE = ['rest','rest','train','train','rest','train','train'];
const WEEKDAY_LABEL = ['日','一','二','三','四','五','六'];

let TARGETS = {
  train: {p:170, k:3000, f:85},
  rest:  {p:155, k:2800, f:78},
};

function pad(n){ return n<10 ? '0'+n : ''+n; }
function toDateStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseDateStr(s){ const [y,m,dd] = s.split('-').map(Number); return new Date(y, m-1, dd); }
function todayStr(){ return toDateStr(new Date()); }
function typeOfDate(dateStr){ return WEEKDAY_TYPE[parseDateStr(dateStr).getDay()]; }
function getMonday(d){
  const day = d.getDay();
  const diff = (day===0? -6 : 1-day);
  const m = new Date(d);
  m.setDate(d.getDate()+diff);
  m.setHours(0,0,0,0);
  return m;
}

let activeDate = todayStr();
let weekOffset = 0; // 0=本週

// logs[dateStr] = {checked:Set<string>, water:number, alts:{"mi-ii":idx}}
const logs = {};
function ensureLog(dateStr){
  if(!logs[dateStr]) logs[dateStr] = {checked:new Set(), water:0, alts:{}};
  return logs[dateStr];
}

function getItemsForDate(dateStr){
  return typeOfDate(dateStr)==='train' ? TRAIN_ITEMS : REST_ITEMS;
}

function effectiveVariant(item, key, dateStr){
  const log = ensureLog(dateStr);
  const idx = log.alts[key] || 0;
  return item.variants[Math.min(idx, item.variants.length-1)];
}

// ---------- 週選單 tabs ----------
function currentWeekDates(){
  const base = new Date();
  const monday = getMonday(base);
  monday.setDate(monday.getDate() + weekOffset*7);
  const arr = [];
  for(let i=0;i<7;i++){
    const d = new Date(monday);
    d.setDate(monday.getDate()+i);
    arr.push(d);
  }
  return arr;
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  const week = currentWeekDates();
  const today = todayStr();
  document.getElementById('weekLabel').textContent =
    weekOffset===0 ? '本週' : (weekOffset>0 ? `第 +${weekOffset} 週` : `第 ${weekOffset} 週`);

  week.forEach(d=>{
    const ds = toDateStr(d);
    const type = typeOfDate(ds);
    const el = document.createElement('div');
    el.className = 'tab' + (ds===activeDate ? ' active '+type : '') + (ds===today ? ' today' : '');
    el.innerHTML = `<span class="d">${WEEKDAY_LABEL[d.getDay()]}</span><span class="dt">${pad(d.getMonth()+1)}/${pad(d.getDate())}</span><span class="k">${type==='train'?'訓練':'休息'}</span>`;
    el.onclick = ()=>{ activeDate = ds; renderAll(); loadLogFor(ds); };
    tabsEl.appendChild(el);
  });
}

document.getElementById('prevWeekBtn').onclick = ()=>{ weekOffset--; renderAll(); };
document.getElementById('nextWeekBtn').onclick = ()=>{ weekOffset++; renderAll(); };

// ---------- 餐點清單 ----------
function renderMeals(){
  const mealsEl = document.getElementById('meals');
  mealsEl.innerHTML = '';
  const items = getItemsForDate(activeDate);
  const log = ensureLog(activeDate);

  items.forEach((mealGroup, mi)=>{
    let mealP=0, mealK=0, mealF=0;
    mealGroup.items.forEach((it,ii)=>{
      const ev = effectiveVariant(it, mi+'-'+ii, activeDate);
      mealP+=ev.p; mealK+=ev.k; mealF+=ev.f;
    });

    const card = document.createElement('div');
    card.className = 'meal';
    card.innerHTML = `
      <div class="meal-head">
        <span class="name">${mealGroup.meal}</span>
        <span class="agg">${mealP}g 蛋白 · ${mealK} kcal · ${mealF}g 脂</span>
      </div>
      <ul class="items"></ul>
    `;
    const ul = card.querySelector('ul.items');
    mealGroup.items.forEach((it, ii)=>{
      const key = mi+'-'+ii;
      const ev = effectiveVariant(it, key, activeDate);
      const checked = log.checked.has(key);
      const li = document.createElement('li');
      li.className = 'item' + (checked ? ' checked' : '');
      li.innerHTML = `
        <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
        <span class="item-text">
          <div class="item-name">${ev.name}</div>
          <div class="item-qty">${ev.qty}</div>
        </span>
        <span class="item-macro">${ev.p}g · ${ev.k}kcal · ${ev.f}g脂</span>
        ${it.variants.length>1 ? '<button class="swap-btn" title="換一個">⇄</button>' : ''}
      `;
      li.onclick = (e)=>{
        if(e.target.closest('.swap-btn')) return;
        if(log.checked.has(key)) log.checked.delete(key); else log.checked.add(key);
        renderAll(); saveCloudLog();
      };
      if(it.variants.length>1){
        li.querySelector('.swap-btn').onclick = (e)=>{
          e.stopPropagation();
          const cur = log.alts[key] || 0;
          log.alts[key] = (cur+1) % it.variants.length;
          renderAll(); saveCloudLog();
        };
      }
      ul.appendChild(li);
    });
    mealsEl.appendChild(card);
  });
}

function renderStats(){
  const items = getItemsForDate(activeDate);
  const log = ensureLog(activeDate);
  let totalP=0, totalK=0, totalF=0;
  items.forEach((mg,mi)=> mg.items.forEach((it,ii)=>{
    const key = mi+'-'+ii;
    if(log.checked.has(key)){
      const ev = effectiveVariant(it, key, activeDate);
      totalP+=ev.p; totalK+=ev.k; totalF+=ev.f;
    }
  }));
  const target = TARGETS[typeOfDate(activeDate)];

  document.getElementById('proteinNum').textContent = totalP + 'g';
  document.getElementById('kcalNum').textContent = totalK;
  document.getElementById('fatNum').textContent = totalF + 'g';
  document.getElementById('proteinTarget').textContent = '目標 ' + target.p + 'g';
  document.getElementById('kcalTarget').textContent = '目標 ' + target.k;
  document.getElementById('fatTarget').textContent = '目標 ' + target.f + 'g';
  document.getElementById('proteinBar').style.width = Math.min(100, totalP/target.p*100) + '%';
  document.getElementById('kcalBar').style.width = Math.min(100, totalK/target.k*100) + '%';
  document.getElementById('fatBar').style.width = Math.min(100, totalF/target.f*100) + '%';

  document.getElementById('waterNum').textContent = log.water;

  const d = parseDateStr(activeDate);
  document.getElementById('footNote').textContent =
    `${d.getMonth()+1}/${d.getDate()}(週${WEEKDAY_LABEL[d.getDay()]})・` + (typeOfDate(activeDate)==='train' ? '訓練日菜單' : '休息日菜單');
}

function renderAll(){
  renderTabs();
  renderMeals();
  renderStats();
}

document.getElementById('resetBtn').onclick = ()=>{
  logs[activeDate] = {checked:new Set(), water:0, alts:{}};
  renderAll();
  saveCloudLog();
};

document.getElementById('water250').onclick = ()=>{ ensureLog(activeDate).water += 250; renderAll(); saveCloudLog(); };
document.getElementById('water500').onclick = ()=>{ ensureLog(activeDate).water += 500; renderAll(); saveCloudLog(); };
document.getElementById('waterReset').onclick = ()=>{ ensureLog(activeDate).water = 0; renderAll(); saveCloudLog(); };

// ---------- 設定面板 ----------

const settingsPanel = document.getElementById('settingsPanel');
gearBtn.onclick = ()=>{
  settingsPanel.classList.toggle('open');

// ---------- Firestore: 單日記錄 ----------
function logDocRef(dateStr){ return doc(db, "dietTrackerUsers", currentUser.uid, "logs", dateStr); }

async function loadLogFor(dateStr){
  if(!currentUser || logs[dateStr]) { renderAll(); return; }
  try{
    const snap = await getDoc(logDocRef(dateStr));
    if(snap.exists()){
      const data = snap.data();
      logs[dateStr] = {checked:new Set(data.checked||[]), water:data.water||0, alts:data.alts||{}};
    } else {
      ensureLog(dateStr);
    }
  }catch(e){
    console.error("讀取當日紀錄失敗:", e);
  }
  renderAll();
}

async function saveCloudLog(){
  if(!currentUser) return;
  const log = ensureLog(activeDate);
  try{
    await setDoc(logDocRef(activeDate), {
      checked: Array.from(log.checked),
      water: log.water,
      alts: log.alts,
    });
    renderAuthBar();
    refreshWeeklyAndStreak();
  }catch(e){
    console.error("寫入雲端資料失敗:", e);
    renderAuthBar({text:'儲存到雲端失敗，請檢查網路或稍後再試', err:true});
  }
}

// ---------- 週統計 + 連續打卡 ----------
async function fetchLogRaw(dateStr){
  try{
    const snap = await getDoc(logDocRef(dateStr));
    if(!snap.exists()) return null;
    const data = snap.data();
    return {checked:new Set(data.checked||[]), water:data.water||0, alts:data.alts||{}};
  }catch(e){ return null; }
}

function totalsFromRaw(raw, dateStr){
  const items = getItemsForDate(dateStr);
  let p=0,k=0;
  items.forEach((mg,mi)=> mg.items.forEach((it,ii)=>{
    const key = mi+'-'+ii;
    if(raw.checked.has(key)){
      const idx = raw.alts[key] || 0;
      const ev = it.variants[Math.min(idx, it.variants.length-1)];
      p+=ev.p; k+=ev.k;
    }
  }));
  return {p,k};
}

async function refreshWeeklyAndStreak(){
  if(!currentUser) return;
  // 近 7 天平均達成率
  const today = new Date();
  let sumPPct=0, sumKPct=0, count=0;
  for(let i=0;i<7;i++){
    const d = new Date(today); d.setDate(today.getDate()-i);
    const ds = toDateStr(d);
    const raw = logs[ds] || await fetchLogRaw(ds);
    if(!raw) continue;
    const totals = totalsFromRaw(raw, ds);
    const target = TARGETS[typeOfDate(ds)];
    sumPPct += Math.min(150, totals.p/target.p*100);
    sumKPct += Math.min(150, totals.k/target.k*100);
    count++;
  }
  document.getElementById('wkProtein').textContent = count ? Math.round(sumPPct/count)+'%' : '尚無資料';
  document.getElementById('wkKcal').textContent = count ? Math.round(sumKPct/count)+'%' : '尚無資料';

  // 連續達標天數(蛋白質達標)
  let streak = 0;
  for(let i=0;i<60;i++){
    const d = new Date(today); d.setDate(today.getDate()-i);
    const ds = toDateStr(d);
    const raw = logs[ds] || await fetchLogRaw(ds);
    if(!raw) break;
    const totals = totalsFromRaw(raw, ds);
    const target = TARGETS[typeOfDate(ds)];
    if(totals.p >= target.p) streak++; else break;
  }
  document.getElementById('streakNum').textContent = streak;
}

// ---------- 體重紀錄 ----------
function weightDocRef(dateStr){ return doc(db, "dietTrackerUsers", currentUser.uid, "weights", dateStr); }

document.getElementById('weightSaveBtn').onclick = async ()=>{
  const val = Number(document.getElementById('weightInput').value);
  if(!val || !currentUser) return;
  try{
    await setDoc(weightDocRef(todayStr()), {weight:val, date:todayStr()});
    document.getElementById('weightInput').value = '';
    loadWeights();
  }catch(e){ console.error("儲存體重失敗:", e); }
};

async function loadWeights(){
  if(!currentUser) return;
  try{
    const q = query(collection(db,"dietTrackerUsers",currentUser.uid,"weights"), orderBy("date","desc"), limit(30));
    const snap = await getDocs(q);
    const entries = [];
    snap.forEach(docSnap=> entries.push(docSnap.data()));
    entries.sort((a,b)=> a.date < b.date ? -1 : 1);
    renderWeightChart(entries);
  }catch(e){ console.error("讀取體重紀錄失敗:", e); }
}

function renderWeightChart(entries){
  const svg = document.getElementById('weightChart');
  const listEl = document.getElementById('weightList');
  if(entries.length===0){
    svg.innerHTML = '';
    listEl.textContent = '尚無體重紀錄';
    return;
  }
  const weights = entries.map(e=>e.weight);
  const min = Math.min(...weights), max = Math.max(...weights);
  const range = (max-min) || 1;
  const w = 600, h = 70, pad = 6;
  const step = entries.length>1 ? (w-pad*2)/(entries.length-1) : 0;
  const pts = entries.map((e,i)=>{
    const x = pad + step*i;
    const y = h - pad - ((e.weight-min)/range)*(h-pad*2);
    return x+','+y;
  });
  svg.innerHTML = `
    <polyline points="${pts.join(' ')}" fill="none" stroke="#8A5A9E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map(p=>{const [x,y]=p.split(','); return `<circle cx="${x}" cy="${y}" r="3" fill="#8A5A9E"/>`;}).join('')}
  `;
  listEl.innerHTML = entries.slice(-6).map(e=>`${e.date.slice(5)}: ${e.weight}kg`).join(' · ');
}

// ---------- 登入狀態變化 ----------
onAuthStateChanged(auth, async (user)=>{
  currentUser = user;
  if(user){
    try{
      const mainSnap = await getDoc(doc(db,"dietTrackerUsers",user.uid));
      if(mainSnap.exists() && mainSnap.data().settings){
        TARGETS = mainSnap.data().settings;
      }
    }catch(e){ console.error("讀取設定失敗:", e); }
    renderAuthBar();
    await loadLogFor(activeDate);
    loadWeights();
    refreshWeeklyAndStreak();
  } else {
    for(const k in logs) delete logs[k];
    renderAuthBar();
    renderAll();
  }
});

renderAuthBar();
renderAll();
