<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>增肌飲食追蹤器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F1E8;
    --panel: #FFFFFF;
    --ink: #232019;
    --ink-soft: #6B6355;
    --line: #E3DACB;
    --protein: #2B6E63;
    --protein-soft: #E4EFEC;
    --kcal: #C0672E;
    --kcal-soft: #F7E8DC;
    --train: #2B6E63;
    --rest: #8A7F6A;
    --done-bg: #F0EDE3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    padding:24px 16px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  header{margin-bottom:20px;}
  .eyebrow{
    font-family:'Space Grotesk',sans-serif;
    font-size:12px;
    letter-spacing:0.14em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin:0 0 6px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:26px;
    font-weight:700;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .sub{color:var(--ink-soft);font-size:14px;margin:0;}

  /* auth bar */
  .authbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 12px;
    margin-top:14px;
    font-size:13px;
  }
  .authbar .msg{color:var(--ink-soft);}
  .google-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--ink);
    color:var(--bg);
    border:none;
    border-radius:8px;
    padding:8px 14px;
    font-size:13px;
    font-family:'Noto Sans TC',sans-serif;
    cursor:pointer;
  }
  .google-btn svg{width:16px;height:16px;flex-shrink:0;}
  .user-chip{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .user-chip img{width:26px;height:26px;border-radius:50%;}
  .user-chip .uname{font-weight:600;font-size:13px;}
  .signout-btn{
    font-size:12px;
    color:var(--ink-soft);
    background:none;
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 10px;
    cursor:pointer;
  }
  .signout-btn:hover{background:var(--done-bg);}
  .sync-note{font-size:11px;color:var(--ink-soft);}
  .sync-note.err{color:var(--kcal);}

  /* day tabs */
  .tabs{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    margin:20px 0 18px;
  }
  .tab{
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:10px;
    padding:8px 2px 7px;
    text-align:center;
    cursor:pointer;
    transition:all .15s ease;
  }
  .tab .d{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;}
  .tab .k{display:block;font-size:10px;margin-top:2px;color:var(--ink-soft);}
  .tab.active{border-color:var(--ink);background:var(--ink);}
  .tab.active .d, .tab.active .k{color:var(--bg);}
  .tab.active.train{background:var(--train);border-color:var(--train);}
  .tab.active.rest{background:var(--rest);border-color:var(--rest);}

  /* progress panel */
  .stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:20px;
  }
  .stat-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
  }
  .stat-label{
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .stat-num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;}
  .bar-track{
    height:8px;
    border-radius:5px;
    background:var(--done-bg);
    margin-top:10px;
    overflow:hidden;
  }
  .bar-fill{height:100%;border-radius:5px;transition:width .3s ease;}
  .protein .bar-fill{background:var(--protein);}
  .kcal .bar-fill{background:var(--kcal);}
  .protein .stat-num{color:var(--protein);}
  .kcal .stat-num{color:var(--kcal);}

  /* meal blocks */
  .meal{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    margin-bottom:12px;
    overflow:hidden;
  }
  .meal-head{
    padding:12px 16px 10px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .meal-head .name{font-weight:700;font-size:15px;}
  .meal-head .agg{font-size:12px;color:var(--ink-soft);}
  ul.items{list-style:none;margin:0;padding:6px 8px;}
  li.item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 8px;
    border-radius:8px;
    cursor:pointer;
    user-select:none;
  }
  li.item:hover{background:var(--done-bg);}
  li.item.checked .item-name, li.item.checked .item-qty{
    text-decoration:line-through;
    color:var(--ink-soft);
  }
  .check{
    width:19px;height:19px;
    border-radius:6px;
    border:1.5px solid var(--line);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--panel);
  }
  li.item.checked .check{background:var(--protein);border-color:var(--protein);}
  .check svg{width:12px;height:12px;opacity:0;}
  li.item.checked .check svg{opacity:1;}
  .item-text{flex:1;min-width:0;}
  .item-name{font-size:14px;font-weight:500;}
  .item-qty{font-size:12px;color:var(--ink-soft);}
  .item-macro{font-size:11px;color:var(--ink-soft);white-space:nowrap;text-align:right;}

  footer{
    margin-top:22px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .reset-btn{
    font-family:'Noto Sans TC',sans-serif;
    font-size:12px;
    background:none;
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px 12px;
    color:var(--ink);
    cursor:pointer;
  }
  .reset-btn:hover{background:var(--done-bg);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">增肌飲食計畫 · 178cm / 82kg</p>
    <h1>今天吃了嗎?</h1>
    <p class="sub">點項目打勾記錄,自動累計蛋白質與熱量進度</p>

    <div class="authbar" id="authbar">
      <span class="msg">正在連線...</span>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="stats">
    <div class="stat-card protein">
      <div class="stat-label"><span>蛋白質</span><span id="proteinTarget"></span></div>
      <div class="stat-num" id="proteinNum">0g</div>
      <div class="bar-track"><div class="bar-fill" id="proteinBar" style="width:0%"></div></div>
    </div>
    <div class="stat-card kcal">
      <div class="stat-label"><span>熱量</span><span id="kcalTarget"></span></div>
      <div class="stat-num" id="kcalNum">0</div>
      <div class="bar-track"><div class="bar-fill" id="kcalBar" style="width:0%"></div></div>
    </div>
  </div>

  <div id="meals"></div>

  <footer>
    <span id="footNote">今天是休息日</span>
    <button class="reset-btn" id="resetBtn">重設今天</button>
  </footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// ⚠️ 這組設定是根據你先前貼過來、已經亂碼的內容「猜測還原」的。
// 如果登入或雲端同步一直失敗，第一件事就是回 Firebase Console → 專案設定 → 你的網頁應用程式，
// 把完整正確的 firebaseConfig 複製貼給我，我再改一次。
const firebaseConfig = {
  apiKey: "AIzaSyCDpIa8nq9j7kC9EpbWIJCzY3moM1MSz2o",
  authDomain: "projerct-d29a6.firebaseapp.com",
  projectId: "projerct-d29a6",
  storageBucket: "projerct-d29a6.firebasestorage.app",
  messagingSenderId: "721257579244",
  appId: "1:721257579244:web:3c8d051d43e49c0b415bc9",
};

const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const auth = getAuth(firebaseApp);
const provider = new GoogleAuthProvider();

let currentUser = null;
let hasLoadedCloudState = false; // guards against saving empty state before cloud load finishes

const TRAIN_ITEMS = [
  {meal:"早餐", items:[
    {name:"全蛋", qty:"3顆", p:21, k:220},
    {name:"全麥吐司", qty:"2片(約80g)", p:8, k:200},
    {name:"無糖豆漿", qty:"300ml", p:10, k:130},
    {name:"香蕉", qty:"1根", p:1, k:105},
  ]},
  {meal:"上午點心", items:[
    {name:"堅果", qty:"20g", p:4, k:120},
    {name:"水果", qty:"1顆", p:0, k:80},
  ]},
  {meal:"午餐", items:[
    {name:"白飯", qty:"350g熟飯", p:8, k:455},
    {name:"雞胸肉/雞腿肉", qty:"150g", p:42, k:230},
    {name:"炒青菜", qty:"150g", p:3, k:80},
  ]},
  {meal:"下午點心", items:[
    {name:"無糖優格", qty:"200g", p:10, k:120},
    {name:"堅果", qty:"15g", p:3, k:90},
  ]},
  {meal:"訓練後", items:[
    {name:"乳清蛋白", qty:"1匙(約30g)", p:24, k:120},
    {name:"香蕉", qty:"1根", p:1, k:105},
  ]},
  {meal:"晚餐", items:[
    {name:"白飯/糙米飯", qty:"250g熟飯", p:6, k:325},
    {name:"牛肉片/鮭魚", qty:"150g", p:39, k:300},
    {name:"炒青菜", qty:"150g", p:3, k:80},
  ]},
];

const REST_ITEMS = [
  {meal:"早餐", items:[
    {name:"全蛋+蛋白", qty:"2全蛋+2蛋白", p:22, k:200},
    {name:"全麥吐司", qty:"1.5片(約60g)", p:6, k:150},
    {name:"無糖豆漿", qty:"250ml", p:8, k:110},
  ]},
  {meal:"上午點心", items:[
    {name:"堅果", qty:"20g", p:4, k:120},
    {name:"水果", qty:"1份", p:1, k:100},
  ]},
  {meal:"午餐", items:[
    {name:"白飯", qty:"250g熟飯", p:6, k:325},
    {name:"雞胸肉", qty:"150g", p:42, k:230},
    {name:"炒青菜", qty:"150g", p:3, k:80},
  ]},
  {meal:"下午點心", items:[
    {name:"無糖優格", qty:"200g", p:10, k:120},
    {name:"堅果", qty:"20g", p:4, k:120},
  ]},
  {meal:"晚餐", items:[
    {name:"糙米飯", qty:"150g熟飯", p:4, k:195},
    {name:"魚肉/雞肉", qty:"180g", p:48, k:300},
    {name:"炒青菜(份量加大)", qty:"200g", p:4, k:100},
    {name:"堅果或酪梨油", qty:"1茶匙", p:0, k:45},
  ]},
  {meal:"睡前(可選)", items:[
    {name:"茅屋起司或優格", qty:"150g", p:12, k:120},
  ]},
];

const DAYS = [
  {label:"一", full:"週一", type:"rest"},
  {label:"二", full:"週二", type:"train"},
  {label:"三", full:"週三", type:"train"},
  {label:"四", full:"週四", type:"rest"},
  {label:"五", full:"週五", type:"train"},
  {label:"六", full:"週六", type:"train"},
  {label:"日", full:"週日", type:"rest"},
];

const TARGETS = {
  train: {p:170, k:3000},
  rest: {p:155, k:2800},
};

let activeDay = 0;
// checked state per day index -> Set of "mealIdx-itemIdx"
const checkedState = {};
DAYS.forEach((_,i)=> checkedState[i] = new Set());

function getItemsForDay(dayIdx){
  return DAYS[dayIdx].type === "train" ? TRAIN_ITEMS : REST_ITEMS;
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  DAYS.forEach((d,i)=>{
    const el = document.createElement('div');
    el.className = 'tab' + (i===activeDay ? ' active '+d.type : '');
    el.innerHTML = `<span class="d">${d.label}</span><span class="k">${d.type==='train'?'訓練':'休息'}</span>`;
    el.onclick = ()=>{ activeDay = i; renderAll(); };
    tabsEl.appendChild(el);
  });
}

function renderMeals(){
  const mealsEl = document.getElementById('meals');
  mealsEl.innerHTML = '';
  const items = getItemsForDay(activeDay);
  const checked = checkedState[activeDay];

  items.forEach((mealGroup, mi)=>{
    const mealP = mealGroup.items.reduce((s,it)=>s+it.p,0);
    const mealK = mealGroup.items.reduce((s,it)=>s+it.k,0);

    const card = document.createElement('div');
    card.className = 'meal';
    card.innerHTML = `
      <div class="meal-head">
        <span class="name">${mealGroup.meal}</span>
        <span class="agg">${mealP}g 蛋白 · ${mealK} kcal</span>
      </div>
      <ul class="items"></ul>
    `;
    const ul = card.querySelector('ul.items');
    mealGroup.items.forEach((it, ii)=>{
      const key = mi+'-'+ii;
      const li = document.createElement('li');
      li.className = 'item' + (checked.has(key) ? ' checked' : '');
      li.innerHTML = `
        <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
        <span class="item-text">
          <div class="item-name">${it.name}</div>
          <div class="item-qty">${it.qty}</div>
        </span>
        <span class="item-macro">${it.p}g · ${it.k}kcal</span>
      `;
      li.onclick = ()=>{
        if(checked.has(key)) checked.delete(key); else checked.add(key);
        renderAll();
        saveCloudState();
      };
      ul.appendChild(li);
    });
    mealsEl.appendChild(card);
  });
}

function renderStats(){
  const items = getItemsForDay(activeDay);
  const checked = checkedState[activeDay];
  let totalP = 0, totalK = 0;
  items.forEach((mg,mi)=> mg.items.forEach((it,ii)=>{
    if(checked.has(mi+'-'+ii)){ totalP += it.p; totalK += it.k; }
  }));
  const target = TARGETS[DAYS[activeDay].type];

  document.getElementById('proteinNum').textContent = totalP + 'g';
  document.getElementById('kcalNum').textContent = totalK;
  document.getElementById('proteinTarget').textContent = '目標 ' + target.p + 'g';
  document.getElementById('kcalTarget').textContent = '目標 ' + target.k;
  document.getElementById('proteinBar').style.width = Math.min(100, totalP/target.p*100) + '%';
  document.getElementById('kcalBar').style.width = Math.min(100, totalK/target.k*100) + '%';

  document.getElementById('footNote').textContent =
    DAYS[activeDay].full + '・' + (DAYS[activeDay].type==='train' ? '訓練日菜單' : '休息日菜單');
}

function renderAll(){
  renderTabs();
  renderMeals();
  renderStats();
}

document.getElementById('resetBtn').onclick = ()=>{
  checkedState[activeDay] = new Set();
  renderAll();
  saveCloudState();
};

// ---------- Auth + cloud sync ----------

function renderAuthBar(syncMsg){
  const bar = document.getElementById('authbar');
  if(currentUser){
    bar.innerHTML = `
      <div class="user-chip">
        <img src="${currentUser.photoURL || ''}" alt="">
        <span class="uname">${currentUser.displayName || currentUser.email || '已登入'}</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="sync-note${syncMsg && syncMsg.err ? ' err' : ''}">${syncMsg ? syncMsg.text : '已同步到雲端'}</span>
        <button class="signout-btn" id="signOutBtn">登出</button>
      </div>
    `;
    document.getElementById('signOutBtn').onclick = ()=> signOut(auth);
  } else {
    bar.innerHTML = `
      <span class="msg">${syncMsg && syncMsg.err ? syncMsg.text : '登入 Google 帳號，打勾自動存雲端、換裝置也讀得回來'}</span>
      <button class="google-btn" id="googleBtn">
        <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.5 29.6 4.5 24 4.5 12.7 4.5 3.5 13.7 3.5 25S12.7 45.5 24 45.5 44.5 36.3 44.5 25c0-1.6-.2-3-.9-4.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.6 18.9 12.5 24 12.5c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.5 29.6 4.5 24 4.5c-7.4 0-13.8 4.2-17 10.2z"/><path fill="#4CAF50" d="M24 45.5c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 36.6 27 37.5 24 37.5c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.9 40.9 16.4 45.5 24 45.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.7l6.6 5.4C40.6 36.6 44.5 31.3 44.5 25c0-1.6-.2-3-.9-4.5z"/></svg>
        使用 Google 登入
      </button>
    `;
    document.getElementById('googleBtn').onclick = ()=>{
      signInWithPopup(auth, provider).catch(err=>{
        console.error("Google 登入失敗:", err);
        renderAuthBar({text:'登入失敗，請再試一次(' + err.code + ')', err:true});
      });
    };
  }
}

function userDocRef(){
  return doc(db, "dietTrackerUsers", currentUser.uid);
}

async function loadCloudState(){
  hasLoadedCloudState = false;
  try{
    const snap = await getDoc(userDocRef());
    if(snap.exists()){
      const data = snap.data();
      DAYS.forEach((_,i)=>{
        checkedState[i] = new Set(data['day'+i] || []);
      });
    } else {
      DAYS.forEach((_,i)=> checkedState[i] = new Set());
    }
    hasLoadedCloudState = true;
    renderAuthBar();
  }catch(e){
    console.error("讀取雲端資料失敗:", e);
    renderAuthBar({text:'讀取雲端資料失敗，暫時只存在本機', err:true});
  }
  renderAll();
}

async function saveCloudState(){
  if(!currentUser || !hasLoadedCloudState) return; // 未登入或還沒載入完成前不寫入，避免用空資料覆蓋雲端
  try{
    const payload = {};
    DAYS.forEach((_,i)=> payload['day'+i] = Array.from(checkedState[i]));
    await setDoc(userDocRef(), payload);
    renderAuthBar();
  }catch(e){
    console.error("寫入雲端資料失敗:", e);
    renderAuthBar({text:'儲存到雲端失敗，請檢查網路或稍後再試', err:true});
  }
}

onAuthStateChanged(auth, (user)=>{
  currentUser = user;
  if(user){
    loadCloudState();
  } else {
    hasLoadedCloudState = false;
    DAYS.forEach((_,i)=> checkedState[i] = new Set());
    renderAuthBar();
    renderAll();
  }
});

renderAuthBar();
renderAll();
</script>
</body>
</html>
